<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>손다현 포트폴리오 - 연락</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="noindex, nofollow" />

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
       padding: 40px 60px 0 60px;
      background: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      color: #121212;
    }

    a { text-decoration: none; color: inherit; }

    header {
      top: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
      background: #ffffff;
      z-index: 100;
    }

    .left-header {
      display: flex;
      align-items: center;
    }

    .left-header .name {
      font-weight: 400;
      font-size: 22pt;
    }

    .left-header .divider {
      width: 1px;
      height: 12px;
      background: #121212;
      margin: 0 22px;
    }

    .left-header .role {
      font-weight: 200;
      font-size: 14pt;
    }

    .nav {
      display: flex;
      align-items: center;
      font-size: 14pt;
    }

    .nav a {
      margin-left: 22px;
      font-weight: 200;
      color: #121212;
      transition: color 0.2s ease;
    }

    .nav a:hover { color: #eb1d1d; }

    .nav a.active {
      font-weight: 200;
      color: #eb1d1d;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 160px;
    }

    .section-title {
      font-weight: 400;
      font-size: 22pt;
      letter-spacing: 0.2em; /* 자간 50 느낌 */
    }

    /* ===== Contact Form Box ===== */
    .contact-box {
      margin-top: 40px;
      width: 860px;
      background: #e8e8e8;
      padding: 80px; /* 안쪽 여백 80px */
    }

    /* 2열 레이아웃: 왼쪽 문구 / 오른쪽 폼(가운데에서 시작하는 느낌) */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 반반 */
      column-gap: 80px;               /* 좌우 사이 간격(이미지 느낌) */
      align-items: start;
    }

    .top-left {
      font-weight: 200;
      font-size: 12pt;
      color: #121212;
    }

    .top-right {
      font-weight: 200;
      font-size: 14pt;
      color: #121212;
    }

    .row-2-left {
      margin-top: 60px;
      font-weight: 400;
      font-size: 22pt;
      color: #121212;
    }

    .form-col {
      margin-top: 60px;
    }



    .field {
      width: 350px; /* 줄 350px */
    }

    .label {
      font-weight: 200;
      font-size: 14pt;
      color: #121212;
      display: block;
      margin-bottom: 10px; /* 글자 10px 밑에 줄 */
    }

    .input-line,
    .select-line,
    .textarea-line {
      width: 350px;
      border: none;
      border-bottom: 1px solid #121212;
      background: transparent;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 200;
      font-size: 14pt;
      color: #121212;
      outline: none;
      padding: 6px 0;
    }

    .textarea-line {
      resize: none;
      height: 70px; /* 메세지* 70px 밑에 줄 느낌 */
      padding: 10px 0;
    }

    .sp-40 { margin-top: 40px; }

    .submit-wrap {
      width: 350px;
      margin-top: 20px; /* 줄 20px 밑에 */
      display: flex;
      justify-content: flex-end;
    }

.submit-btn {
  width: 80px;
  height: 32px;
  background: #000;
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;

  font-size: 16px;
  font-weight: 200;
  line-height: 32px;

  border: none;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}


/* 성공 */
.submit-btn.success {
  background: #70ab23;
  cursor: default;
}

/* 실패 */
.submit-btn.error {
  background: #cd0723;
}


    .submit-btn:active { transform: translateY(1px); }

    .caption {
      margin-top: 40px;
      font-weight: 200;
      font-size: 12pt;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 120px; /* 그 밑 120px 여백 */
    }

.form-status{
  width: 350px;
  margin-top: 16px;
  font-weight: 200;
  font-size: 12pt;
  color: #121212;
}

    /* 모바일(간단 대응) */
    @media (max-width: 980px) {
      body { padding: 40px 24px 120px 24px; }
      header { left: 24px; right: 24px; }
      main { margin-top: 160px; }

      .contact-box { width: 100%; padding: 24px; }
      .contact-grid { grid-template-columns: 1fr; row-gap: 40px; column-gap: 0; }

      .row-2-left, .form-col { margin-top: 0; }

      .field, .input-line, .select-line, .textarea-line, .submit-wrap { width: 100%; }
      .input-line, .select-line, .textarea-line { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="left-header">
      <div class="name">손다현</div>
      <div class="divider"></div>
      <div class="role">디자이너</div>
    </div>

    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="profile.html">프로필</a>
      <a href="projects.html">프로젝트</a>
      <a href="contact.html" class="active">연락</a>
    </nav>
  </header>

  <main id="contact">
    <h1 class="section-title">연락</h1>

    <section class="contact-box" aria-label="연락 폼">
      <div class="contact-grid">
        <!-- 상단 1행 -->
        <div class="top-left">PROJECT INQUIRY</div>
        <div class="top-right">문의가 있다면 폼을 통해 남겨주세요.</div>

        <!-- 2행 (80px 아래) -->
        <div class="row-2-left">일반 문의</div>

<form id="contactForm" class="form-col"
      action="https://formspree.io/f/xkoonglj"
      method="POST">


          <div class="field">
  <input
    class="input-line"
    id="name"
    name="name"
    type="text"
    placeholder="성함*"
    required
  >
</div>

<div class="field sp-40">
  <input
    class="input-line"
    id="email"
    name="email"
    type="email"
    placeholder="이메일*"
    required
  >
</div>

<div class="field sp-40">
  <select
    class="select-line"
    id="type"
    name="type"
    required
  >
    <option value="" disabled selected>문의유형*</option>
    <option value="project">프로젝트 제안</option>
    <option value="collab">협업 문의</option>
    <option value="recruit">채용 관련</option>
    <option value="etc">기타</option>
  </select>
</div>

<div class="field sp-40">
  <textarea
    class="textarea-line"
    id="message"
    name="message"
    placeholder="메시지*"
    required
  ></textarea>
</div>


          <div class="submit-wrap">
            <button id="submitBtn" class="submit-btn" type="submit">제출</button>
          </div>

        </form>
      </div>
    </section>

    <p class="caption">
      Son Dahyun– Design Portfolio<br>
      Crafting Product Stories Through Design, Photography &amp; 3D Visualization
    </p>
  </main>

<script>
  const form = document.getElementById('contactForm');
  const submitBtn = document.getElementById('submitBtn');

  const DEFAULT_TEXT = '제출';
  const WAIT_MS = 3000;
  let resetTimer = null;

  function resetButton() {
    submitBtn.textContent = DEFAULT_TEXT;
    submitBtn.classList.remove('success', 'error');
    submitBtn.disabled = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (resetTimer) clearTimeout(resetTimer);

    submitBtn.textContent = '전송 중...';
    submitBtn.classList.remove('success', 'error');
    submitBtn.disabled = true;

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        submitBtn.textContent = '성공✔';
        submitBtn.classList.add('success');
        form.reset();
      } else {
        submitBtn.textContent = '실패';
        submitBtn.classList.add('error');
      }
    } catch (err) {
      submitBtn.textContent = '실패';
      submitBtn.classList.add('error');
    } finally {
      resetTimer = setTimeout(resetButton, WAIT_MS);
    }
  });
</script>




</body>
</html>
