<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>손다현 포트폴리오 - 연락</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* 1. 기본 설정 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      color: #121212;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    button, input, textarea, select { font-family: inherit; }

    /* 2. 헤더 스타일 (Index와 동일) */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      padding: 0 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      z-index: 1000;
    }

    .left-header { display: flex; align-items: center; }
    .left-header .name { font-weight: 500; font-size: 1.8rem; white-space: nowrap; }
    .left-header .divider { width: 1px; height: 16px; background: #121212; margin: 0 20px; }
    .left-header .role { font-weight: 300; font-size: 1.1rem; white-space: nowrap; }

    /* PC용 네비게이션 */
    .nav { display: flex; align-items: center; font-size: 1.1rem; }
    .nav a { margin-left: 24px; font-weight: 300; transition: color 0.2s; }
    .nav a:hover { color: #eb1d1d; font-weight: 400; }
    .nav a.active { color: #eb1d1d; font-weight: 400; }

    /* 3. 모바일 전용 요소 (사이드바) */
    .menu-toggle-btn { display: none; background: none; border: none; cursor: pointer; padding: 10px; z-index: 1001; }
    
    .mobile-sidebar {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mobile-sidebar.open { transform: translateX(0); }

    .mobile-close-btn {
      position: absolute;
      top: 20px; right: 20px;
      background: none; border: none; cursor: pointer; padding: 10px;
    }

    .mobile-nav-link {
      font-size: 1.1rem; 
      font-weight: 300;
      letter-spacing: 0.05em;
      margin: 20px 0;
      color: #999;
      transition: all 0.3s;
    }
    .mobile-nav-link:hover { color: #121212; }
    .mobile-nav-link.active { font-weight: 400; color: #eb1d1d; transform: scale(1.05); }

    .menu-toggle-btn svg { transition: transform 0.3s; }

    /* 4. 메인 레이아웃 (높이 통일 핵심) */
    main {
      /* ✅ PC: 140px (Index, Projects와 동일) */
      padding-top: 140px; 
      padding-bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      animation: fadeEffect 0.8s ease;
    }

    @keyframes fadeEffect {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-weight: 400;
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      margin-bottom: 60px;
      text-align: center;
    }

    /* Contact 박스 스타일 */
    .contact-container {
      width: 100%;
      max-width: 900px;
      background: #f4f4f4;
      padding: 80px;
      border-radius: 4px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 60px;
    }

    /* 왼쪽 텍스트 영역 */
    .info-col { display: flex; flex-direction: column; }
    
    /* ✅ 요청사항: 글자 두께 얇게(300) */
    .info-label { 
      font-size: 0.9rem; 
      font-weight: 300; 
      margin-bottom: 15px; 
      letter-spacing: 0.05em; 
      color: #888; 
    }

    .info-title { 
      font-size: 2rem; 
      font-weight: 300; 
      line-height: 1.3; 
      margin-bottom: 40px; 
    }

    .info-desc { 
      font-size: 1.1rem; 
      font-weight: 300; 
      line-height: 1.6; 
      color: #555; 
    }

    /* 오른쪽 폼 영역 */
    .form-col { display: flex; flex-direction: column; gap: 30px; }

    /* Input Style */
    .input-group { position: relative; width: 100%; }

    .input-field {
      width: 100%;
      border: none;
      border-bottom: 1px solid #aaa;
      background: transparent;
      padding: 10px 0;
      font-size: 1.1rem;
      font-weight: 300;
      color: #121212;
      outline: none;
      transition: border-color 0.3s;
      border-radius: 0;
    }
    .input-field:focus { border-bottom-color: #121212; }

    .input-label {
      position: absolute; top: 10px; left: 0;
      font-size: 1.1rem; font-weight: 300; color: #888;
      pointer-events: none; transition: all 0.3s ease;
    }

    .input-field:focus ~ .input-label,
    .input-field:valid ~ .input-label {
      top: -12px; font-size: 0.8rem; color: #121212; font-weight: 400;
    }

    /* Select 박스 */
    select.input-field { -webkit-appearance: none; appearance: none; cursor: pointer; color: #121212; }
    select.input-field:invalid { color: #888; }
    
    .select-arrow {
      position: absolute; right: 0; top: 15px; pointer-events: none;
      width: 10px; height: 10px;
      border-right: 1px solid #121212; border-bottom: 1px solid #121212;
      transform: rotate(45deg);
    }

    textarea.input-field { resize: none; height: 100px; }

    /* 제출 버튼 */
    .submit-wrap { display: flex; justify-content: flex-end; align-items: center; margin-top: 20px; }

    .submit-btn {
      min-width: 100px; height: 40px;
      background: #121212; color: #fff;
      font-size: 1rem; font-weight: 300; border: none;
      cursor: pointer; transition: background 0.3s, transform 0.1s;
      padding: 0 20px; display: flex; align-items: center; justify-content: center;
    }
    .submit-btn:hover { background: #333; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn.success { background: #4CAF50; cursor: default; }
    .submit-btn.error { background: #F44336; }

    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px;
    }
    @keyframes spin { to {transform: rotate(360deg);} }

    .footer {
      margin-top: 60px; text-align: center;
      font-weight: 300; color: #888; font-size: 0.9rem; line-height: 1.6;
    }

    /* 5. 반응형 (모바일) 스타일 */
    @media (max-width: 1100px) { /* 태블릿/모바일 분기점 통일 */
      header { padding: 0 20px; height: 60px; }
      .left-header .name { font-size: 1.2rem; }
      .left-header .role { font-size: 0.9rem; }
      .left-header .divider { height: 12px; margin: 0 12px; }

      /* 메뉴 전환 */
      .nav { display: none; }
      .menu-toggle-btn { display: block; }
      
      /* ✅ 모바일: 100px (Profile, Index와 높이 맞춤) */
      main { padding-top: 100px; padding-bottom: 60px; }

      .section-title { font-size: 1.4rem; margin-bottom: 30px; }

      .contact-container {
        width: 100%;
        padding: 40px 24px;
        background: transparent; /* 모바일은 배경 제거하여 깔끔하게 */
      }
      
      /* 세로 배치 */
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .info-title { font-size: 1.4rem; margin-bottom: 20px; }
      .form-col { gap: 24px; }
      .submit-btn { width: 100%; height: 50px; font-size: 1.1rem; }
    }
  </style>
</head>

<body>
  <header>
    <div class="left-header">
      <div class="name">손다현</div>
      <div class="divider"></div>
      <div class="role">디자이너</div>
    </div>

    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="profile.html">프로필</a>
      <a href="projects.html">프로젝트</a>
      <a href="contact.html" class="active">연락</a>
    </nav>

    <button class="menu-toggle-btn" id="menuOpenBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <div class="mobile-sidebar" id="mobileSidebar">
    <button class="mobile-close-btn" id="menuCloseBtn">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <a href="index.html" class="mobile-nav-link">홈</a>
    <a href="profile.html" class="mobile-nav-link">프로필</a>
    <a href="projects.html" class="mobile-nav-link">프로젝트</a>
    <a href="contact.html" class="mobile-nav-link active">연락</a>
  </div>

  <main>
    <h1 class="section-title">CONTACT</h1>

    <div class="contact-container">
      <div class="contact-grid">
        <div class="info-col">
          <div class="info-label">PROJECT INQUIRY</div>
          <div class="info-title">문의가 있다면<br>남겨주세요.</div>
          <div class="info-desc">
            <br>
            
          </div>
        </div>

        <form id="contactForm" class="form-col" action="https://formspree.io/f/xkoonglj" method="POST">
          
          <div class="input-group">
            <input type="text" id="name" name="name" class="input-field" required autocomplete="off">
            <label for="name" class="input-label">성함 (Name)</label>
          </div>

          <div class="input-group">
            <input type="email" id="email" name="email" class="input-field" required autocomplete="off">
            <label for="email" class="input-label">이메일 (E-mail)</label>
          </div>

          <div class="input-group">
            <select id="type" name="type" class="input-field" required>
              <option value="" disabled selected hidden></option> 
              <option value="project">프로젝트 제안</option>
              <option value="collab">협업 문의</option>
              <option value="recruit">채용 관련</option>
              <option value="etc">기타</option>
            </select>
            <label for="type" class="input-label">문의유형 (Type)</label>
            <div class="select-arrow"></div>
          </div>

          <div class="input-group">
            <textarea id="message" name="message" class="input-field" required></textarea>
            <label for="message" class="input-label">메시지 (Message)</label>
          </div>

          <div class="submit-wrap">
            <button id="submitBtn" class="submit-btn" type="submit">
              <span class="spinner"></span>
              <span class="btn-text">보내기</span>
            </button>
          </div>

        </form>
      </div>
    </div>

    <div class="footer">
      Son Dahyun – Design Portfolio<br>
      Crafting Product Stories Through Design, Photography &amp; 3D Visualization
    </div>
  </main>

  <script>
    // 1. 모바일 메뉴 토글
    const menuOpenBtn = document.getElementById('menuOpenBtn');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const sidebar = document.getElementById('mobileSidebar');

    function openMenu() {
      sidebar.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      sidebar.classList.remove('open');
      document.body.style.removeProperty('overflow');
    }
    if(menuOpenBtn) menuOpenBtn.addEventListener('click', openMenu);
    if(menuCloseBtn) menuCloseBtn.addEventListener('click', closeMenu);

    // 2. 폼 제출 로직
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const spinner = submitBtn.querySelector('.spinner');

    const WAIT_MS = 3000;
    let resetTimer = null;

    function resetButton() {
      btnText.textContent = '보내기';
      submitBtn.classList.remove('success', 'error');
      submitBtn.disabled = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (resetTimer) clearTimeout(resetTimer);

      btnText.textContent = '전송 중...';
      spinner.style.display = 'inline-block';
      submitBtn.disabled = true;

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        spinner.style.display = 'none';

        if (res.ok) {
          btnText.textContent = '전송 완료 ✔';
          submitBtn.classList.add('success');
          form.reset();
        } else {
          throw new Error('Network response was not ok');
        }
      } catch (err) {
        spinner.style.display = 'none';
        btnText.textContent = '전송 실패';
        submitBtn.classList.add('error');
        console.error(err);
      } finally {
        resetTimer = setTimeout(resetButton, WAIT_MS);
      }
    });
  </script>
</body>
</html>
