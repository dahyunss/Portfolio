<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>손다현 포트폴리오</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 🔒 검색 엔진에 노출 안 되게 -->
  <meta name="robots" content="noindex, nofollow" />

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      padding: 40px 60px 120px 60px;
      background: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      color: #121212;
    }

    a { text-decoration: none; color: inherit; }

    /* 🔝 항상 상단에 고정되는 헤더 */
    header {
      top: 40px;         /* 위 여백 40px 유지 */
      left: 60px;        /* 좌우 여백 60px */
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
      background: #ffffff;
      z-index: 100;
    }

    /* 왼쪽 헤더 */
    .left-header {
      display: flex;
      align-items: center;
    }

    .left-header .name {
      font-weight: 400;
      font-size: 22pt;
    }

    .left-header .divider {
      width: 1px;
      height: 12px;
      background: #121212;
      margin: 0 22px;
    }

    .left-header .role {
      font-weight: 200;
      font-size: 14pt;
    }

    /* 오른쪽 네비 */
 .nav {
  display: flex;
  align-items: center;
  font-size: 14pt;
}

.nav a {
  margin-left: 22px;
  font-weight: 200;
  color: #121212;
  transition: color 0.2s ease;
}

/* 마우스 올렸을 때는 살짝 진하게(빨간색) */
.nav a:hover {
  color: #eb1d1d;
}

/* 선택된 페이지(현재 페이지)는 빨간색으로 표시 */
.nav a.active {
  font-weight: 200;
  color: #eb1d1d;
}


    /* 헤더가 fixed라서, 그 아래 컨텐츠와 간격 보정 */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 160px; /* 원래 120이었는데 헤더 빠진 만큼 +40 보정 */
    }

    .section-title {
      font-weight: 400;
      font-size: 22pt;
      letter-spacing: 0.2em;
    }

    /* 슬라이더 */
    .slider-wrapper {
      margin-top: 40px;
      position: relative;
      width: 860px;
      height: 532px;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e0e0e0;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }

    .slide.active { opacity: 1; }

.arrow-btn {
  position: fixed; /* 페이지 기준 가로 위치 잡기 위해 fixed */
  background: none;
  border: none;
  font-size: 34px;
  font-weight: 200;
  cursor: pointer;
  padding: 12px;
  line-height: 1;
  color: #121212;
  opacity: 0.7;
  transition: opacity 0.2s ease;
  z-index: 1000;
}

.arrow-btn:hover {
  opacity: 1;
}

/* 페이지 양끝에서 60px */
.arrow-prev { left: 60px; }
.arrow-next { right: 60px; }

    /* 이미지 아래 캡션 */
    .caption {
      margin-top: 40px;
      font-weight: 200;
      font-size: 12pt;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>
    <div class="left-header">
      <div class="name">손다현</div>
      <div class="divider"></div>
      <div class="role">디자이너</div>
    </div>

    <!-- 🔗 파일 이름 그대로 연결 + 홈 페이지라 홈에 active 클래스 -->
    <nav class="nav">
      <a href="index.html" class="active">홈</a>
      <a href="profile.html">프로필</a>
      <a href="projects.html">프로젝트</a>
      <a href="contact.html">연락</a>
    </nav>
  </header>

  <main id="home">
    <h1 class="section-title">포트폴리오</h1>

    <div class="slider-wrapper">
<div class="slider" id="slider">

  <img class="slide active"
       src="https://dl.dropboxusercontent.com/scl/fi/iqhsecjdisj6yq947nbc7/THINK.jpg?rlkey=x0gynuypsyumer22wm9zcvxqo"
       alt="THINK">

  <img class="slide"
       src="https://dl.dropboxusercontent.com/scl/fi/azuf15sqdaj1kkyn170vi/SEE.jpg?rlkey=xsytz0pj69j3we4puuo5r063x"
       alt="SEE">

  <img class="slide"
       src="https://dl.dropboxusercontent.com/scl/fi/6mb6e58sbzuqfykcpumqq/MAKE.jpg?rlkey=2goc093ibqbc0g17kt3uci0y9"
       alt="MAKE">

</div>


      <button class="arrow-btn arrow-prev" id="prevBtn">&#8249;</button>
      <button class="arrow-btn arrow-next" id="nextBtn">&#8250;</button>
    </div>

    <p class="caption">
      Son Dahyun– Design Portfolio<br>
      Crafting Product Stories Through Design, Photography &amp; 3D Visualization
    </p>
  </main>

  <script>
    (function () {
      const slides = document.querySelectorAll('.slide');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      let current = 0;
      const stayTime = 5000;
      let timer = null;

      function showSlide(index) {
        slides[current].classList.remove('active');
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('active');
      }

      function nextSlide() { showSlide(current + 1); }
      function prevSlide() { showSlide(current - 1); }

      function startAutoPlay() {
        stopAutoPlay();
        timer = setInterval(nextSlide, stayTime);
      }

      function stopAutoPlay() {
        if (timer) clearInterval(timer);
      }

      nextBtn.addEventListener('click', () => { nextSlide(); startAutoPlay(); });
      prevBtn.addEventListener('click', () => { prevSlide(); startAutoPlay(); });

      startAutoPlay();
    })();

function updateArrowPosition() {
  const slider = document.querySelector('.slider-wrapper');
  const rect = slider.getBoundingClientRect(); 
  const middleY = rect.top + rect.height / 2;

  // 화살표 세로 위치 조정
  document.querySelector('.arrow-prev').style.top = middleY + 'px';
  document.querySelector('.arrow-next').style.top = middleY + 'px';
}

// 첫 로딩 시 적용
updateArrowPosition();

// 창 크기 바뀌면 자동 재계산
window.addEventListener('resize', updateArrowPosition);
window.addEventListener('scroll', updateArrowPosition);


  </script>
</body>
</html>
